<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>진로상담앱</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1f2937;
      --sub: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent-soft: #eaf1fe;
      --error-bg: #fdecec;
      --error-text: #b42318;
      --ok-bg: #e8f6ee;
      --ok-text: #18794e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 17px;
      line-height: 1.6;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 28px; margin: 0 0 6px; }
    h2 { font-size: 21px; margin: 0 0 16px; }
    .lead { color: var(--sub); margin: 0 0 28px; }
    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px 20px;
      margin-bottom: 24px;
    }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    .hint { font-weight: 400; color: var(--sub); font-size: 15px; }
    input, select, textarea {
      width: 100%;
      font: inherit;
      padding: 12px 14px;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }
    textarea { min-height: 120px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      font: inherit;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-main { background: var(--accent); color: #fff; width: 100%; margin-top: 20px; }
    .btn-main:disabled { opacity: .6; cursor: wait; }
    .btn-go { background: var(--accent); color: #fff; }
    .btn-wait { background: var(--line); color: var(--sub); cursor: default; }
    .msg { display: none; margin-top: 16px; padding: 14px 16px; border-radius: 10px; }
    .msg.show { display: block; }
    .msg.ok { background: var(--ok-bg); color: var(--ok-text); }
    .msg.error { background: var(--error-bg); color: var(--error-text); }
    .preview { display: none; margin-top: 24px; }
    .preview.show { display: block; }
    .preview p { margin: 0 0 8px; color: var(--sub); font-size: 15px; }
    .table-box { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
    table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 15px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    th { background: var(--accent-soft); }
    tr:last-child td { border-bottom: none; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .tab {
      min-height: 44px;
      padding: 0 18px;
      font: inherit;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #fff;
    }
    .badge {
      align-self: flex-start;
      font-size: 14px;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .card h3 { margin: 0; font-size: 19px; word-break: break-all; }
    .card p { margin: 0 0 8px; color: var(--sub); flex: 1; word-break: break-all; }
    .empty { color: var(--sub); margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>진로상담앱</h1>
    <p class="lead">상담 내용을 기록하고, 자주 쓰는 도구를 한곳에서 열어 보세요.</p>

    <!-- 1. 시트에 저장 -->
    <section>
      <h2>상담 기록 남기기</h2>
      <form id="recordForm" novalidate>
        <label for="studentNo">학생 번호 <span class="hint">(이름 대신 번호만 적어요. 예: 10305)</span></label>
        <input id="studentNo" name="studentNo" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="숫자만 입력">

        <label for="type">상담 분류</label>
        <select id="type" name="type">
          <option value="">불러오는 중이에요…</option>
        </select>

        <label for="memo">상담 내용 <span class="hint">(연락처·성적은 적지 마세요)</span></label>
        <textarea id="memo" name="memo" maxlength="1000" placeholder="상담한 내용을 짧게 적어 주세요"></textarea>

        <button type="submit" class="btn btn-main" id="submitBtn" disabled>제출</button>
      </form>
      <div class="msg" id="formMsg" role="status"></div>

      <div class="preview" id="preview">
        <p>아직 저장된 기록이 없어요. 저장되면 시트에 아래 모양으로 한 줄씩 쌓여요. (예시예요)</p>
        <div class="table-box">
          <table>
            <thead><tr id="previewHead"></tr></thead>
            <tbody id="previewBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 2·3. 도구 카드 목록 + 분류 탭 -->
    <section>
      <h2>도구 모음</h2>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="cards" id="cards"></div>
    </section>
  </div>

  <script>
    /* ===== 1. Apps Script 웹 앱 주소 =====
     * ▼ 바꿔야 할 줄: Apps Script에서 [배포]한 뒤 나온 주소(…/exec로 끝남)를 따옴표 안에 붙여넣으세요.
     */
    var SCRIPT_URL = '';

    /* ===== 2. 도구 목록: 새 도구는 여기에 한 줄만 추가하세요 =====
     * name: 도구 이름 / desc: 한 줄 설명 / url: 주소 (비우면 "준비 중")
     * category: 분류. 새 분류 이름을 적으면 탭이 자동으로 생겨요.
     */
    var TOOLS = [
      { name: '[도구 이름]', desc: '[한 줄 설명]', url: '', category: '업무' },
      { name: '[도구 이름]', desc: '[한 줄 설명]', url: '', category: '수업' },
      { name: '[도구 이름]', desc: '[한 줄 설명]', url: '', category: '학급' }
    ];

    var EXAMPLE_ROWS = [
      ['2026. 3. 10 오후 2:00:00', '10305', '진로 탐색', '관심 분야를 함께 찾아봄'],
      ['2026. 3. 12 오전 10:30:00', '20117', '학과·과목 선택', '2학년 선택 과목 고민 상담'],
      ['2026. 3. 15 오후 4:10:00', '30209', '진학 상담', '희망 전형 정리, 다음 상담 약속']
    ];

    var current = '전체';

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }
    function showMsg(text, kind) {
      var box = document.getElementById('formMsg');
      box.textContent = text;
      box.className = 'msg show ' + kind;
    }
    function hideMsg() {
      document.getElementById('formMsg').className = 'msg';
    }

    /* Apps Script와 주고받기 (15초가 지나면 멈추고 안내해요) */
    function callScript(options) {
      var controller = ('AbortController' in window) ? new AbortController() : null;
      var timer = setTimeout(function () { if (controller) controller.abort(); }, 15000);
      if (controller) options.signal = controller.signal;
      return fetch(SCRIPT_URL, options)
        .then(function (res) {
          if (!res.ok) throw new Error('서버가 응답하지 않아요. (오류 번호 ' + res.status + ')');
          return res.json();
        })
        .then(function (data) {
          clearTimeout(timer);
          if (!data || !data.ok) throw new Error((data && data.error) || '알 수 없는 문제가 생겼어요.');
          return data;
        })
        .catch(function (err) {
          clearTimeout(timer);
          if (err && err.name === 'AbortError') {
            throw new Error('응답이 너무 늦어요. 인터넷 연결을 확인하고 다시 해 주세요.');
          }
          if (err instanceof TypeError) {
            throw new Error('구글 시트와 연결하지 못했어요. SCRIPT_URL 주소가 맞는지, 배포의 액세스 권한이 "모든 사용자"인지 확인해 주세요.');
          }
          throw err;
        });
    }

    /* 첫 화면: 상담 분류와 시트 상태를 불러와요 */
    function loadInit() {
      if (!SCRIPT_URL) {
        showMsg('아직 구글 시트와 연결되지 않았어요. index.html의 SCRIPT_URL 줄에 Apps Script 웹 앱 주소를 넣어 주세요.', 'error');
        document.getElementById('type').options[0].textContent = '연결 후에 고를 수 있어요';
        return;
      }
      callScript({ method: 'GET' })
        .then(function (data) {
          var select = document.getElementById('type');
          select.options[0].textContent = '하나 골라 주세요';
          (data.recordTypes || []).forEach(function (t) {
            var opt = el('option', '', t);
            opt.value = t;
            select.appendChild(opt);
          });
          if (data.memoMax) document.getElementById('memo').maxLength = data.memoMax;
          if (data.isEmpty) showPreview(data.headers);
          document.getElementById('submitBtn').disabled = false;
        })
        .catch(function (err) {
          document.getElementById('type').options[0].textContent = '불러오지 못했어요';
          showMsg('첫 화면을 불러오지 못했어요: ' + err.message, 'error');
        });
    }

    /* 시트가 비어 있을 때 예시 3줄 */
    function showPreview(headers) {
      var head = document.getElementById('previewHead');
      var body = document.getElementById('previewBody');
      head.innerHTML = '';
      body.innerHTML = '';
      (headers || []).forEach(function (h) { head.appendChild(el('th', '', h)); });
      EXAMPLE_ROWS.forEach(function (row) {
        var tr = el('tr');
        row.forEach(function (c) { tr.appendChild(el('td', '', c)); });
        body.appendChild(tr);
      });
      document.getElementById('preview').classList.add('show');
    }

    /* 분류 탭: 도구 목록의 분류 값에서 자동으로 만들어요 */
    function drawTabs() {
      var names = ['전체'];
      TOOLS.forEach(function (t) {
        var c = String(t.category || '기타');
        if (names.indexOf(c) === -1) names.push(c);
      });
      var box = document.getElementById('tabs');
      box.innerHTML = '';
      names.forEach(function (name) {
        var b = el('button', 'tab' + (name === current ? ' active' : ''), name);
        b.type = 'button';
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', name === current ? 'true' : 'false');
        b.onclick = function () { current = name; drawTabs(); drawCards(); };
        box.appendChild(b);
      });
    }

    /* 도구 카드 */
    function drawCards() {
      var box = document.getElementById('cards');
      box.innerHTML = '';
      var list = TOOLS.filter(function (t) {
        return current === '전체' || String(t.category || '기타') === current;
      });
      if (list.length === 0) {
        box.appendChild(el('p', 'empty', '이 분류에는 아직 도구가 없어요.'));
        return;
      }
      list.forEach(function (t) {
        var card = el('div', 'card');
        card.appendChild(el('span', 'badge', String(t.category || '기타')));
        card.appendChild(el('h3', '', String(t.name || '이름 없음')));
        card.appendChild(el('p', '', String(t.desc || '')));
        var url = String(t.url || '').trim();
        if (url) {
          var a = el('a', 'btn btn-go', '바로가기');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          card.appendChild(a);
        } else {
          var w = el('button', 'btn btn-wait', '준비 중');
          w.type = 'button';
          w.disabled = true;
          card.appendChild(w);
        }
        box.appendChild(card);
      });
    }

    /* [제출] */
    document.getElementById('recordForm').addEventListener('submit', function (e) {
      e.preventDefault();
      hideMsg();

      var data = {
        studentNo: document.getElementById('studentNo').value.trim(),
        type: document.getElementById('type').value,
        memo: document.getElementById('memo').value.trim()
      };
      if (!/^\d{1,6}$/.test(data.studentNo)) {
        showMsg('학생 번호는 숫자로만 적어 주세요. (예: 10305)', 'error');
        return;
      }
      if (!data.type) {
        showMsg('상담 분류를 하나 골라 주세요.', 'error');
        return;
      }
      if (!data.memo) {
        showMsg('상담 내용을 적어 주세요.', 'error');
        return;
      }

      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '저장하는 중…';

      // text/plain으로 보내야 구글 쪽에서 막지 않아요
      callScript({
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      })
        .then(function () {
          document.getElementById('recordForm').reset();
          document.getElementById('preview').classList.remove('show');
          showMsg('저장했어요. 시트 맨 아래에 새 줄이 생겼어요.', 'ok');
        })
        .catch(function (err) {
          showMsg('저장하지 못했어요: ' + err.message, 'error');
        })
        .then(function () {
          btn.disabled = false;
          btn.textContent = '제출';
        });
    });

    drawTabs();
    drawCards();
    loadInit();
  </script>
</body>
</html>
